<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abay Jobs Vacancy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f0f5f0;
  margin: 0;
}
header {
  background: #00843d;
  color: white;
  padding: 25px;
}
button {
  width: 85%;
  padding: 17px;
  margin: 9px;
  border: none;
  border-radius: 12px;
  background: #00843d;
  color: white;
  font-size: 17px;
}
</style>
</head>
<body>

<header>
<h2>🇪🇹 ABAY JOBS</h2>
<p>Your Future, Our Priority!</p>
</header>

<h3>Find Your Dream Job</h3>

<button onclick="showJobs('Government')">🏛️ Government Jobs</button>
<button onclick="showJobs('NGO')">🏢 NGO Jobs</button>
<button onclick="showJobs('Private')">🏬 Private Jobs</button>
<button onclick="showJobs('All')">📢 Open Jobs</button>

<div id="jobs"></div>
<button>🔍 Search Jobs</button>
<button>📤 Post a Vacancy</button>
<button onclick="alert('Apply for Jobs')">
📋 Apply Now
</button>

<button onclick="alert('Admin Panel')">
👨‍💼 Admin Panel
</button>

<button onclick="alert('Telegram Notifications')">
🔔 Telegram Notifications
</button>
<script>

Telegram.WebApp.ready();
Telegram.WebApp.expand();

function showJobs(category) {

  let jobs = document.getElementById("jobs");

  jobs.innerHTML = `
    <h2>📢 ${category} Jobs</h2>
    <p>Welcome to Abay Jobs Vacancy!</p>
    <p>Vacancies will appear here.</p>
  `;

  jobs.scrollIntoView({behavior:"smooth"});

}

</script>

</body>
</html>
